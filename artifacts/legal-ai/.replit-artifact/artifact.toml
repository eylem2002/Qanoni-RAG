kind = "web"
previewPath = "/legal-ai/"
title = "Qanooni Law Admin"
version = "1.0.0"
id = "artifacts/legal-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/legal-ai/" ]
localPort = 20544

[services.development]
run = "pnpm --filter @workspace/legal-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/legal-ai", "run", "build" ]
publicDir = "artifacts/legal-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20544"
BASE_PATH = "/legal-ai/"
